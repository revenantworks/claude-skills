name: Accessibility barrier
description: Something in the docs, a skill, or a mod is hard to read, reach, or use.
title: "[Accessibility]: "
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. Do not paste secrets, real names, personal paths, or email
        addresses.
  - type: input
    id: where
    attributes:
      label: Where is the barrier
      description: A file, a page, a skill, or a mod.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in your way
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: What you use (optional)
      description: For example a screen reader, keyboard only, or high zoom.
  - type: textarea
    id: fix
    attributes:
      label: A change that would help (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data (names, paths, emails, keys) from this report.
          required: true
