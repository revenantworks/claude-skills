name: Bug report
description: A skill, script, mod, or workflow does not work as written.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste secrets, real names, personal paths, or email
        addresses. Use placeholders such as `<name>` and `~/path/to/file`.
        To report a security problem, use the private form linked on the issue chooser.
  - type: input
    id: component
    attributes:
      label: Skill, pack, or mod
      description: Name the part that failed.
      placeholder: "for example: warden pack, trustwarden skill"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you used.
      placeholder: "for example: 1.0.0"
  - type: dropdown
    id: surface
    attributes:
      label: Where you ran it
      options:
        - Claude Code
        - Claude app (web, desktop, or mobile)
        - Another tool that supports Agent Skills
        - Command line only
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Say what you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data (names, paths, emails, keys) from this report.
          required: true
