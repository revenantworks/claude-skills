name: warden-ci

# The warden members' script suites (gatewarden's hook battery and the others), which pack-ci
# never ran (observation 0372). Path-filtered by owner decision 2026-10-10: it fires only when a
# push to main touches packs/warden/ or this file. No pull_request trigger and no tags: the repo
# has no branch protection, so the merged push to main runs the same checks.
on:
  push:
    branches: [main]
    paths: ["packs/warden/**", ".github/workflows/warden-ci.yml"]

permissions:
  contents: read

concurrency:
  group: warden-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # Each suite runs from its own scripts folder: packs/warden has no __init__.py, so a
      # discover from the pack root finds 0 tests and exits 0. A run that fails, or that ran
      # 0 tests, fails the job. Totals at 8471a70 (local Windows run): gatewarden 320,
      # keywarden 36, shieldwarden 91, trustwarden 57.
      - name: Run every warden member's script suite
        run: |
          set +e -u  # the default bash -e would stop at the first red suite; every suite reports
          status=0
          found=0
          summary=""
          for d in packs/warden/skills/*/scripts; do
            ls "$d"/test_*.py >/dev/null 2>&1 || continue
            found=$((found + 1))
            member=$(basename "$(dirname "$d")")
            echo "::group::$member"
            log=$(mktemp)
            (cd "$d" && python3 -m unittest discover -p 'test_*.py') >"$log" 2>&1
            rc=$?
            cat "$log"
            echo "::endgroup::"
            ran=$(grep -Eo '^Ran [0-9]+ tests?' "$log" | tail -n 1 | grep -Eo '[0-9]+' || true)
            ran=${ran:-0}
            summary="$summary$member: $ran tests, exit $rc"$'\n'
            if [ "$rc" -ne 0 ]; then
              echo "::error::$member: unittest exited $rc"
              status=1
            fi
            if [ "$ran" -eq 0 ]; then
              echo "::error::$member: Ran 0 tests"
              status=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no warden scripts folder holds test_*.py"
            status=1
          fi
          printf '%s' "$summary"
          printf '%s' "$summary" >> "$GITHUB_STEP_SUMMARY"
          exit $status
