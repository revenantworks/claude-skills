name: pack-ci

on:
  push:
    branches: [main]
    tags: ["*-v*", "v*"]
  # No pull_request trigger (removed 2026-10-11; CI-1 added it 2026-10-06): main has no branch
  # protection, so a red PR could merge anyway, and the merged push to main runs the same jobs.

# Three jobs from one script:
#   check  — every push to main and every tag: registry↔manifest drift + per-skill validation, no writes
#   release — on tag v*: sync + build dist zips, attach every member zip to the release
#   mods   — every push to main and every tag: the mod-only plugins validate and pass their tests
#
# check runs on tags too and release needs it. It used to skip itself on tags —
# the one event that publishes — so every release since attached 11 member zips
# to a public Release with neither the unit tests nor --check ever run on the
# tagged ref (verified against the ossuary-v2.2.4 run: check skipped, release
# success). It is a sub-minute job; there is no ref it is not worth running on.

permissions:
  contents: read

# Minute budget: a newer push to the same ref cancels the older run, main
# included (owner 2026-10-03). A tag is its own ref and is never cancelled, so a
# release run always finishes.
# No paths-ignore: SKILL.md and the other .md files ARE what `check` validates.
concurrency:
  group: pack-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python3 -m unittest discover -s tools -p "test_*.py" -v
      - run: python3 tools/build.py --check
      # The name-leak check is local only: its list stays on the maintainer's
      # machine and is never uploaded, so CI has nothing to run it with.
      # It runs before every push instead (RUNBOOK.md, "Name-leak check").

  # The mod-only plugins under mods/: the shared library in step, every plugin valid under
  # --strict, and every plugin's tests green, on a pinned Claude Code (CI-1, 2026-10-06).
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code@2.1.290
      - run: python3 mods/sync_shared.py --check
      # The VS Code extension's own tests (no dependencies; mods/README.md "Testing").
      - run: node --test mods/vscode
      - run: python3 -m unittest discover -s mods/vscode -p "test_*.py"
      # A plugin is tested when it ships hooks, an MCP server (.mcp.json or mcpServers in its
      # manifest) or registers a tool: a tool the model calls is a boundary the host checks
      # (obs 0344), so a plugin with one never skips its tests. A plugin that ships a *.test.ts
      # is tested whatever it holds.
      - name: Validate and test every mod plugin
        run: |
          set -e
          for p in mods/*/.claude-plugin/plugin.json; do d="${p%/.claude-plugin/plugin.json}"
            echo "::group::$d"
            claude plugin validate --strict "$d"
            if [ -f "$d/hooks/hooks.json" ] || [ -f "$d/.mcp.json" ] \
              || grep -rqsE --exclude-dir=tests 'tool\.register\s*[<(]|"mcpServers"' "$d" \
              || find "$d" -path '*/node_modules' -prune -o -name '*.test.ts' -print | grep -q .; then
              claude plugin test "$d"
            fi
            echo "::endgroup::"
          done

  release:
    if: contains(github.ref, '-v') || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python3 tools/build.py
      - name: Attach member zips to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
