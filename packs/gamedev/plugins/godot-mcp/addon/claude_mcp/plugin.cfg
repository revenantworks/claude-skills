[plugin]

name="Claude MCP"
description="Lets Claude Code drive this editor through eight fixed tools over a loopback port with a per-session token: run and stop scenes, read output and errors, list the scene tree, add nodes and set properties (undoable), save the open scene. Nothing deletes or runs code sent to it."
author="Revenantworks"
version="1.0.0"
script="plugin.gd"
