<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture</title>
<style>
:root { --accent: #3a72a8; }
body { color: #1c2430; background-color: #ffffff; }
.is-new td { background: color-mix(in srgb, var(--accent) 18%, transparent); }
</style>
</head>
<body>
<table>
<tbody>
<tr class="is-new"><td>A tinted row whose ground mixes the accent with what lies under it.</td></tr>
</tbody>
</table>
</body>
</html>
